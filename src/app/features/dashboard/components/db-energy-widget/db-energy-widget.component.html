<section class="energy-card">
  <div class="flex items-start justify-between mb-1">
    <div>
      <h2 class="text-base font-extrabold text-slate-800">¿Cómo te sientes hoy?</h2>
      <p class="text-xs text-slate-400 mt-0.5">Muéstranos tu nivel de energía actual</p>
    </div>
    <!-- Bolt indicator top right -->
    <div class="bolt-badge" [style.background]="energyColor() + '20'" [style.color]="energyColor()">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M13 2 4.09 12.96A.5.5 0 004.5 14H11l-1 8 8.91-10.96A.5.5 0 0018.5 10H12l1-8z"/>
      </svg>
    </div>
  </div>

  <!-- Slider -->
  <div class="energy-slider-wrapper mt-6">
    <div class="energy-bolt" [style.left]="boltLeft()" [style.color]="energyColor()">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M13 2 4.09 12.96A.5.5 0 004.5 14H11l-1 8 8.91-10.96A.5.5 0 0018.5 10H12l1-8z"/>
      </svg>
    </div>
    <input type="range" min="0" max="100"
      [value]="energyLevel()"
      (input)="setEnergyLevel($event)"
      class="energy-slider-input"
      [class.ec-red]="energyLevel() < 25"
      [class.ec-orange]="energyLevel() >= 25 && energyLevel() < 50"
      [class.ec-yellow]="energyLevel() >= 50 && energyLevel() < 75"
      [class.ec-green]="energyLevel() >= 75" />
  </div>

  <!-- Emoji row -->
  <div class="flex justify-between mt-4">
    @for (e of energyEmojis; track $index; let i = $index) {
      <div class="emoji-item"
           [style.background]="activeEmojiIndex() === i ? energyColor() + '20' : 'transparent'"
           [style.outline]="activeEmojiIndex() === i ? '2px solid ' + energyColor() : 'none'">
        <img [src]="e.icon" class="w-6 h-6" alt="" draggable="false" />
      </div>
    }
  </div>
</section>
