<section class="streak-card">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h2 class="text-base font-extrabold" style="color:#1A1D1F">Racha de enfoque 🔥</h2>
      <p class="text-xs font-semibold mt-0.5" style="color:#00B87C">7 días consecutivos</p>
    </div>
  </div>

  <div class="flex items-end justify-between gap-1">
    @for (day of days; track day.label) {
      <div class="flex flex-col items-center gap-1.5">
        <span class="text-[10px] font-semibold" style="color:#8A94A6">{{ day.label }}</span>
        <div class="day-circle"
             [class.day-circle--done]="day.done"
             [class.day-circle--pending]="!day.done">
          @if (day.done) {
            <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
          }
        </div>
      </div>
    }
  </div>
</section>
