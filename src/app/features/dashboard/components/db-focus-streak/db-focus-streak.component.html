<section class="streak-card">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h2 class="text-base font-extrabold text-slate-800">Racha de enfoque 🔥</h2>
      <p class="text-xs text-slate-400 mt-0.5">7 días consecutivos</p>
    </div>
    <div class="streak-badge">7</div>
  </div>

  <div class="flex items-center justify-between gap-1.5">
    @for (day of days; track day.label) {
      <div class="flex flex-col items-center gap-1.5">
        <div class="day-circle" [class.day-circle--done]="day.done">
          @if (day.done) {
            <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
          }
        </div>
        <span class="text-[10px] font-semibold text-slate-400">{{ day.label }}</span>
      </div>
    }
  </div>
</section>
