<aside class="sidebar-inner">

  <!-- Logo pill -->
  <div class="logo-pill">
    <img src="assets/images/logotipoNudgeme.png" alt="NudgeMe" class="logo-img" />
    <span class="font-extrabold text-base tracking-tight" style="color:#1A1D1F">NudgeMe</span>
  </div>

  <!-- Nav items -->
  <nav class="flex-1 mt-6 flex flex-col" style="gap:6px">
    @for (item of navItems; track item.label) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{exact: true}">
        <lucide-icon
          [img]="item.icon"
          [size]="19"
          [color]="undefined">
        </lucide-icon>
        <span class="text-sm">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Profile card -->
  <div class="profile-card">
    <div class="flex items-center gap-3 mb-3">
      <div class="avatar-wrap">
        @if (userAvatar) {
          <img [src]="userAvatar" alt="Avatar" class="w-full h-full object-cover rounded-full" />
        } @else {
          <img src="assets/images/estadoDeAnimo.png" alt="Avatar"
               class="w-full h-full object-cover rounded-full" style="mix-blend-mode:multiply" />
        }
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold truncate" style="color:#1A1D1F">{{ userName }}</p>
        <p class="text-xs font-medium mt-0.5" style="color:#8A94A6">Nivel {{ level }}</p>
      </div>
      <button class="profile-arrow-btn">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
    <div class="xp-track">
      <div class="xp-fill" [style.width.%]="xpPercent"></div>
    </div>
    <p class="text-[10px] mt-1.5 font-medium" style="color:#8A94A6">{{ xp }} / {{ xpMax }} XP</p>
  </div>

  <!-- Motivational quote -->
  <div class="quote-card">
    <p class="text-xs font-semibold leading-relaxed text-center" style="color:#00B87C">
      "Pequeños pasos hoy,<br>grandes logros mañana."
    </p>
    <div class="flex justify-center mt-2">
      <span class="text-sm">💚</span>
    </div>
  </div>

</aside>
