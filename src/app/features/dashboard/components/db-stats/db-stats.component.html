<section>
  <h2 class="text-lg font-extrabold text-slate-800 mb-5">Tu progreso esta semana</h2>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

    <!-- Productivity circle -->
    <div class="stat-card stat-card--white">
      <div class="relative flex items-center justify-center mb-3">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="38" fill="none" stroke="#f1f5f9" stroke-width="7"/>
          <circle #circleRef cx="48" cy="48" r="38" fill="none"
                  stroke="url(#grad-prod)" stroke-width="7"
                  stroke-linecap="round"
                  [attr.stroke-dasharray]="circumference"
                  [attr.stroke-dashoffset]="circumference"
                  transform="rotate(-90 48 48)"/>
          <defs>
            <linearGradient id="grad-prod" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#22C55E"/>
              <stop offset="100%" stop-color="#16A34A"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="absolute flex flex-col items-center">
          <span class="text-xl font-black text-slate-800">{{ progressPct }}%</span>
        </div>
      </div>
      <p class="text-sm font-bold text-slate-700 text-center">Productividad</p>
      <p class="text-xs text-emerald-600 font-semibold text-center mt-1">¡Excelente!</p>
    </div>

    <!-- Completed tasks -->
    <div class="stat-card" style="background:#F2ECFF">
      <div class="stat-icon-wrap" style="background:#E9D5FF">
        <svg class="w-5 h-5" fill="none" stroke="#7C3AED" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        </svg>
      </div>
      <p class="text-2xl font-black text-slate-800 mt-3">12 <span class="text-slate-400 text-base font-semibold">de 15</span></p>
      <p class="text-sm font-bold text-slate-700 mt-1">Tareas completadas</p>
      <div class="stat-mini-bar mt-3">
        <div class="stat-mini-fill" style="width:80%; background:linear-gradient(90deg,#A855F7,#7C3AED)"></div>
      </div>
    </div>

    <!-- Focus time -->
    <div class="stat-card" style="background:#DCFCE7">
      <div class="stat-icon-wrap" style="background:#BBF7D0">
        <svg class="w-5 h-5" fill="none" stroke="#16A34A" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 6v6l4 2"/>
        </svg>
      </div>
      <p class="text-2xl font-black text-slate-800 mt-3">5h <span class="text-base font-semibold text-slate-500">30m</span></p>
      <p class="text-sm font-bold text-slate-700 mt-1">Enfoque total</p>
      <div class="stat-mini-bar mt-3">
        <div class="stat-mini-fill" style="width:68%; background:linear-gradient(90deg,#22C55E,#16A34A)"></div>
      </div>
    </div>

  </div>
</section>
