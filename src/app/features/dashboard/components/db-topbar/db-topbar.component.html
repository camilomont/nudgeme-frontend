<header class="topbar">
  <div class="flex items-center gap-3 ml-auto">
    <!-- Date -->
    <p class="text-sm font-medium hidden sm:block" style="color:#8A94A6">{{ dateLabel }}</p>

    <!-- Notification bell -->
    <button class="topbar-icon-btn" aria-label="Notificaciones">
      <lucide-icon [img]="Bell" [size]="18" color="#64748b"></lucide-icon>
      <span class="notif-dot"></span>
    </button>

    <!-- Sun button -->
    <button class="sun-btn" aria-label="Clima">
      <lucide-icon [img]="Sun" [size]="18" color="#FBBF24"></lucide-icon>
    </button>
  </div>
</header>
